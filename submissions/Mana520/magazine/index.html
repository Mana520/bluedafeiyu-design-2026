<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>蓝色大肥鱼 月刊 · 2026年10月号 国庆特集</title>
<meta name="description" content="把蓝色大肥鱼做成一本日系杂志：封面、目次、特集索引、作品图版页与角色名录。441 件 AI 娘二创按杂志编辑的方式重新装帧。">
<link rel="stylesheet" href="../../../starter/tokens.css">
<style>
/* ================================================================
   蓝色大肥鱼 月刊 —— 日系杂志编辑部风格
   单文件 · 零依赖 · 数据来自 ../../../starter/data.js (window.SITE_DATA)
   ================================================================ */
:root {
  --paper: #f7f4ec;
  --paper-2: #efece2;
  --ink: #1c1b18;
  --sub: #7a756a;
  --hair: #d9d3c4;
  --accent: #2743c7;
  --red: #bd3117;
  --serif: Palatino, "Palatino Linotype", "Songti SC", STSong, SimSun, "Noto Serif SC", "Source Han Serif SC", serif;
  --sans: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 15px; line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--accent); color: #fff; }
a { color: inherit; }
img { display: block; }
.sheet { max-width: 1280px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px) 60px; }
.mono { font-family: var(--mono); }
.rule2 { border-top: 3px double var(--ink); }
.hairline { border: 0; border-top: 1px solid var(--hair); margin: 0; }

/* ---------- 刊头 ---------- */
.masthead {
  display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
  padding: 22px 0 14px;
}
.masthead .brand { font-family: var(--serif); font-size: 22px; font-weight: 700; letter-spacing: .34em; }
.masthead .issue { font-family: var(--mono); font-size: 12px; color: var(--sub); letter-spacing: .18em; }
.masthead .sp { flex: 1; }
.masthead nav { display: flex; gap: 22px; font-size: 13px; letter-spacing: .14em; }
.masthead nav a { text-decoration: none; color: var(--sub); border-bottom: 2px solid transparent; padding-bottom: 2px; }
.masthead nav a:hover { color: var(--ink); }
.masthead nav a.on { color: var(--ink); border-color: var(--accent); font-weight: 700; }

/* ---------- 印章 ---------- */
.seal {
  display: inline-grid; place-items: center; text-align: center;
  width: 56px; height: 56px; background: var(--red); color: #fff;
  font-family: var(--serif); font-weight: 700; font-size: 19px; line-height: 1.15;
  letter-spacing: .08em; transform: rotate(4deg);
  box-shadow: 0 2px 10px rgba(120, 30, 10, .25);
}

/* ---------- 封面 ---------- */
.cover-grid {
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
  gap: clamp(24px, 4vw, 64px); align-items: end; padding: clamp(20px, 4vw, 56px) 0 34px;
}
.cover-title { font-family: var(--serif); font-weight: 700; line-height: 1.18; letter-spacing: .04em; }
.cover-title .big { font-size: clamp(42px, 6.2vw, 84px); display: block; }
.cover-title .big em { font-style: normal; color: var(--accent); }
.cover-kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .42em; color: var(--red); margin: 0 0 14px; }
.cover-sub { color: var(--sub); font-size: 14px; max-width: 30em; margin: 18px 0 0; }
.cover-hero { position: relative; }
.cover-hero img { width: 100%; max-height: 74vh; object-fit: cover; object-position: top; border: 1px solid var(--ink); }
.cover-hero .plate-cap {
  display: flex; justify-content: space-between; gap: 12px;
  font-family: var(--mono); font-size: 11px; color: var(--sub);
  padding-top: 8px; letter-spacing: .1em;
}
.cover-seal { position: absolute; top: -20px; right: -14px; }
.toc { padding: 26px 0 8px; }
.toc .toc-label { font-family: var(--serif); font-size: 15px; letter-spacing: .5em; color: var(--sub); }
.toc-list { margin: 10px 0 0; padding: 0; list-style: none; }
.toc-list li {
  display: flex; align-items: baseline; gap: 16px; width: 100%;
  background: none; border: 0; border-bottom: 1px solid var(--hair);
  font: inherit; text-align: left; padding: 13px 2px; cursor: pointer;
}
.toc-list li:hover { background: var(--paper-2); }
.toc-list .no { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.toc-list .t { font-family: var(--serif); font-size: 19px; font-weight: 700; letter-spacing: .06em; }
.toc-list .d { color: var(--sub); font-size: 13px; flex: 1; }
.toc-list .p { font-family: var(--mono); font-size: 12px; color: var(--sub); }
.colophon {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  border-top: 3px double var(--ink); margin-top: 26px; padding-top: 14px;
  font-family: var(--mono); font-size: 11px; color: var(--sub); letter-spacing: .12em;
}
.barcode {
  height: 30px; width: 128px;
  background: repeating-linear-gradient(90deg,
    var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 6px, transparent 6px 9px,
    var(--ink) 9px 12px, transparent 12px 14px);
}
.vertical-note {
  position: fixed; right: 14px; top: 50%; transform: translateY(-50%);
  writing-mode: vertical-rl; font-family: var(--serif); font-size: 12px;
  letter-spacing: .55em; color: var(--sub); pointer-events: none;
}
@media (max-width: 900px) { .vertical-note { display: none; } .cover-grid { grid-template-columns: 1fr; align-items: start; } .cover-seal { right: 6px; } }

/* ---------- 章节头 ---------- */
.sec-head { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; padding: 34px 0 6px; }
.sec-head .no { font-family: var(--mono); font-size: 13px; color: var(--accent); letter-spacing: .2em; }
.sec-head h2 { margin: 0; font-family: var(--serif); font-size: clamp(26px, 3.4vw, 40px); letter-spacing: .1em; }
.sec-head .en { font-family: var(--mono); font-size: 11px; color: var(--sub); letter-spacing: .3em; }
.sec-head .cnt { margin-left: auto; font-family: var(--serif); font-size: 15px; color: var(--sub); }
.sec-head .cnt b { color: var(--ink); font-size: 22px; }
.sec-lead { color: var(--sub); font-size: 13.5px; max-width: 46em; margin: 0 0 18px; }

/* ---------- 索引工具行 ---------- */
.toolbar { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 10px 0 4px; border-top: 1px solid var(--hair); }
.toolbar .lbl { font-family: var(--mono); font-size: 11px; color: var(--sub); letter-spacing: .2em; flex: none; }
.toolbar .tabs { display: flex; gap: 18px; flex-wrap: wrap; }
.toolbar .tabs button {
  background: none; border: 0; padding: 2px 0; cursor: pointer;
  font: inherit; font-size: 13.5px; color: var(--sub); letter-spacing: .08em;
  border-bottom: 2px solid transparent;
}
.toolbar .tabs button:hover { color: var(--ink); }
.toolbar .tabs button.on { color: var(--ink); font-weight: 700; border-color: var(--accent); }
.toolbar .tabs button .n { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-left: 4px; }
.toolbar input[type="search"] {
  flex: 1 1 200px; min-width: 160px; background: none; border: 0; outline: 0;
  border-bottom: 1px solid var(--ink); padding: 4px 2px; font: inherit; font-size: 14px;
}
.toolbar input[type="search"]::placeholder { color: #b3ac9c; }
.hitline { font-family: var(--mono); font-size: 11px; color: var(--sub); letter-spacing: .14em; padding: 8px 0 16px; }
.hitline b { color: var(--red); }

/* ---------- 特集索引（不对称栅格） ---------- */
.mosaic { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 30px 22px; grid-auto-flow: dense; padding-bottom: 30px; }
.mcard { text-decoration: none; cursor: pointer; display: block; }
.mcard .ph {
  width: 100%; aspect-ratio: 4 / 5; object-fit: cover; background: var(--paper-2);
  border: 1px solid var(--hair);
  transition: filter .3s ease;
}
.mosaic.mono .mcard .ph { filter: grayscale(1) contrast(1.03); }
.mosaic.mono .mcard:hover .ph, .mosaic.mono .mcard:focus-visible .ph { filter: none; border-color: var(--ink); }
.mosaic:not(.mono) .mcard:hover .ph { border-color: var(--ink); }
.mcard.lead { grid-column: span 2; grid-row: span 2; }
.mcard .cap { padding: 8px 2px 0; display: flex; flex-direction: column; gap: 2px; }
.mcard .cap .l1 { display: flex; gap: 8px; align-items: baseline; }
.mcard .cap .no { font-family: var(--mono); font-size: 10.5px; color: var(--sub); letter-spacing: .1em; }
.mcard .cap .nm { font-family: var(--serif); font-weight: 700; font-size: 15px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mcard .cap .who { font-size: 11.5px; color: var(--accent); letter-spacing: .1em; }
.newmark {
  display: inline-block; font-size: 10px; line-height: 1; color: var(--red);
  border: 1px solid var(--red); padding: 1px 3px; margin-right: 6px; vertical-align: 2px;
  font-family: var(--serif); font-weight: 700;
}
.empty-note { padding: 60px 0; text-align: center; color: var(--sub); font-family: var(--serif); letter-spacing: .2em; }

/* ---------- 图版页（作品详情） ---------- */
.plate { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr); gap: clamp(22px, 3.4vw, 54px); padding: 26px 0 40px; }
.plate .imgbox img { width: 100%; max-height: 80vh; object-fit: contain; border: 1px solid var(--ink); background: #fff; }
.plate .imgbox .cap { font-family: var(--mono); font-size: 11px; color: var(--sub); letter-spacing: .12em; padding-top: 8px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.article .kicker { font-family: var(--mono); font-size: 11.5px; color: var(--red); letter-spacing: .24em; margin: 4px 0 10px; }
.article .kicker .sep { color: var(--sub); }
.article h1 { margin: 0 0 6px; font-family: var(--serif); font-size: clamp(26px, 3.2vw, 40px); line-height: 1.25; letter-spacing: .04em; }
.article .byline { font-family: var(--mono); font-size: 11px; color: var(--sub); letter-spacing: .16em; padding-bottom: 14px; border-bottom: 1px solid var(--ink); }
.article .body-lead { margin: 18px 0 0; font-size: 15.5px; line-height: 2; }
.article .body-lead::first-letter { font-family: var(--serif); font-size: 2.9em; line-height: .85; float: left; padding: 4px 10px 0 0; color: var(--accent); font-weight: 700; }
.editor-note { position: relative; margin: 26px 0 0; padding: 14px 0 14px 20px; border-left: 3px solid var(--accent); background: linear-gradient(90deg, rgba(39,67,199,.05), transparent 70%); }
.editor-note .tag { position: absolute; top: -9px; left: 14px; background: var(--paper); padding: 0 8px; font-family: var(--mono); font-size: 10.5px; color: var(--accent); letter-spacing: .3em; }
.editor-note p { margin: 0; font-family: var(--serif); font-size: 14px; line-height: 2; color: #45423a; }
.kw { margin: 22px 0 0; font-size: 12.5px; color: var(--sub); letter-spacing: .08em; }
.kw b { font-family: var(--mono); font-size: 11px; color: var(--ink); letter-spacing: .2em; margin-right: 10px; }
.kw span { border-bottom: 1px solid var(--hair); margin-right: 12px; }
.actions { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 26px; }
.btn {
  display: inline-block; text-decoration: none; font-size: 13px; letter-spacing: .16em;
  padding: 9px 20px; border: 1px solid var(--ink); background: none; cursor: pointer; font-family: inherit;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.btn.solid { background: var(--ink); color: var(--paper); }
.btn.solid:hover { background: var(--accent); border-color: var(--accent); }
.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 30px; border-top: 1px solid var(--hair); padding-top: 16px; }
.pager a { text-decoration: none; font-family: var(--serif); font-size: 14px; letter-spacing: .1em; color: var(--sub); }
.pager a:hover { color: var(--accent); }
.backline { font-size: 12.5px; letter-spacing: .14em; margin-top: 18px; }
.backline a { color: var(--sub); text-decoration: none; border-bottom: 1px solid var(--hair); }
.backline a:hover { color: var(--ink); }
@media (max-width: 860px) { .plate { grid-template-columns: 1fr; } }

/* ---------- 角色名录 ---------- */
.charrow {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; align-items: baseline; gap: 18px;
  width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--hair);
  padding: 22px 2px; cursor: pointer; font: inherit; color: inherit;
  transition: padding-left .18s ease;
}
.charrow:hover { padding-left: 12px; background: var(--paper-2); }
.charrow .idx { font-family: var(--mono); font-size: 12px; color: var(--sub); }
.charrow .nm { font-family: var(--serif); font-size: clamp(22px, 2.6vw, 32px); font-weight: 700; letter-spacing: .08em; }
.charrow .nm small { font-size: 12px; font-weight: 400; color: var(--sub); letter-spacing: .12em; margin-left: 12px; font-family: var(--sans); }
.charrow .kwline { grid-column: 2 / 4; font-size: 12px; color: var(--sub); letter-spacing: .06em; }
.charrow .kwline i { font-style: normal; border: 1px solid var(--hair); padding: 0 6px; margin-right: 8px; }
.charrow .cnt { font-family: var(--serif); font-size: 24px; }
.charrow .cnt small { font-family: var(--mono); font-size: 11px; color: var(--sub); margin-left: 4px; }
.charrow .feat { color: var(--red); font-family: var(--mono); font-size: 10.5px; letter-spacing: .2em; border: 1px solid var(--red); padding: 1px 6px; margin-left: 10px; vertical-align: 4px; }
.swatch { width: 44px; height: 10px; display: inline-block; margin-right: 8px; vertical-align: 2px; border: 1px solid rgba(0,0,0,.15); }

/* ---------- 页脚 ---------- */
.colophon.final { margin-top: 40px; }

/* ---------- 无卡带 ---------- */
.nocart { padding: 90px 20px; text-align: center; color: var(--sub); }
.nocart .big { font-family: var(--serif); font-size: 30px; color: var(--ink); letter-spacing: .3em; }
@media (prefers-reduced-motion: reduce) { .mcard .ph { transition: none; } .charrow { transition: none; } }
</style>
</head>
<body>
<div class="vertical-note">藍色大肥魚・二創圖像開放檔案</div>
<div class="sheet" id="app"></div>

<script src="../../../starter/data.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n, l) => String(n).padStart(l, "0");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
document.addEventListener("error", e => {
  const t = e.target;
  if (t.tagName !== "IMG") return;
  if (!t.dataset.fb && t.dataset.alt) { t.dataset.fb = "1"; t.src = t.dataset.alt; return; }
  const ph = document.createElement("div");
  ph.style.cssText = "aspect-ratio:4/5;display:grid;place-items:center;border:1px solid var(--hair);background:var(--paper-2);font-size:26px";
  ph.textContent = "🐳";
  t.replaceWith(ph);
}, true);

const D = window.SITE_DATA;
const app = $("#app");
if (!D || !Array.isArray(D.works)) {
  app.innerHTML = `<div class="nocart"><div class="big">未 检 测 到 稿 件</div><p>请把本页放在活动仓库 submissions/你的GitHub用户名/ 目录下打开（通过 ../../../starter/data.js 读数）。</p></div>`;
  throw new Error("SITE_DATA missing");
}
const works = D.works;
const charById = new Map(D.characters.map(c => [c.id, c]));
const catById = new Map(D.categories.map(c => [c.id, c]));
const worksByChar = new Map(D.characters.map(c => [c.id, []]));
works.forEach(w => worksByChar.get(w.characterId)?.push(w));
const activeChars = D.characters.filter(c => worksByChar.get(c.id).length);
const syncedAt = new Date(D.syncedAt || Date.now());
const newestTs = Math.max(...works.map(w => +new Date(w.createdAt)));
const newSet = new Set([...works].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 20).map(w => w.slug));
const isNew = w => newSet.has(w.slug);
const thumbNo = new Map([...works].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt)).map((w, i) => [w.slug, i + 1]));
const ISSUE = "No." + works.length;
const ISSUE_DATE = new Date(newestTs).toLocaleDateString("zh-CN", { year: "numeric", month: "long" });

const state = { q: "", char: "", cats: new Set(), sort: "new", tone: "mono" };
try { state.tone = localStorage.getItem("magazine-tone") === "color" ? "color" : "mono"; } catch {}
function filtered() {
  const q = state.q.trim().toLowerCase();
  let list = works.filter(w => {
    if (state.char && w.characterId !== state.char) return false;
    if (state.cats.size && !(w.categoryIds || []).some(c => state.cats.has(c))) return false;
    if (q) {
      const c = charById.get(w.characterId);
      const hay = (w.name + " " + (w.description || "") + " " + (w.tags || []).join(" ") + " " + (c ? c.name + (c.aliases || []).join(" ") : "")).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  if (state.sort === "new") list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  else if (state.sort === "old") list.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  else list = [...list].sort(() => Math.random() - .5);
  return list;
}

function masthead(active) {
  const link = (h, t, k) => `<a href="${h}" class="${active === k ? "on" : ""}">${t}</a>`;
  return `<header class="masthead">
    <span class="brand">藍色大肥魚</span>
    <span class="issue">月刊 · 二創圖像檔案 · ${esc(ISSUE)} · ${esc(ISSUE_DATE)}</span>
    <span class="sp"></span>
    <nav>${link("#/", "封面", "cover")}${link("#/works", "特集索引", "works")}${link("#/chars", "角色名录", "chars")}</nav>
  </header><hr class="rule2">`;
}
function footer() {
  return `<footer class="colophon final">
    <span>藍色大肥魚 PRESS · 第二編輯部</span>
    <span class="barcode" aria-hidden="true"></span>
    <span>定価：無料</span>
    <span>2026 年 10 月号 · 国慶特集 · 第 77 个国庆</span>
    <a href="../index.html">🏠 版本选择</a>
    <a href="../fish-dex/index.html">🕹️ 图鉴版</a>
    <a href="../os98/index.html">🖥️ OS 98 版</a>
    <a href="https://xn--pssy23gqgbz2d718b.com/" target="_blank" rel="noopener">正式站 ↗</a>
    <a href="https://xn--pssy23gqgbz2d718b.com/events/national-day-2026.html" target="_blank" rel="noopener">征集活动 ↗</a>
    <span>图片版权归原作者所有 · 本页为国庆前台设计征集投稿</span>
  </footer>`;
}
const whoOf = w => charById.get(w.characterId)?.name || "其他角色";
const catsOf = w => (w.categoryIds || []).map(id => catById.get(id)?.name).filter(Boolean).join(" · ");

/* ================= 封面 ================= */
function renderCover() {
  const hero = [...works].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
  const ds = worksByChar.get("deepseek").length;
  app.innerHTML = masthead("cover") + `
  <section class="cover-grid">
    <div>
      <p class="cover-kicker">MONTHLY · AI-CHARACTER FANWORK ARCHIVE</p>
      <h1 class="cover-title">
        <span class="big">AI 娘的<br><em>${works.length}</em> 种心情，</span>
        <span class="big">一次收齐。</span>
      </h1>
      <p class="cover-sub">梗图、插画、设定图与漫画——围绕 DeepSeek 娘、GPT 娘、Claude 娘等 ${activeChars.length} 位 AI 角色的二创图像档案。本月特辑：跟随 ${ds} 件 DeepSeek 娘作品，潜入深海。</p>
      <div class="toc">
        <div class="toc-label">目次 CONTENTS</div>
        <ul class="toc-list">
          <li data-go="#/works" data-char="deepseek"><span class="no">01</span><span class="t">特集：深海 的 DeepSeek 娘</span><span class="d">收录 ${ds} 件 · 头像到长图</span><span class="p">p.02</span></li>
          <li data-go="#/works"><span class="no">02</span><span class="t">新着 20 件</span><span class="d">最近一批入库作品</span><span class="p">p.03</span></li>
          <li data-go="#/chars"><span class="no">03</span><span class="t">角色名录</span><span class="d">${activeChars.length} 位 AI 娘的收录档案</span><span class="p">p.05</span></li>
          <li data-go="#/works"><span class="no">04</span><span class="t">分类索引</span><span class="d">梗图 ${works.filter(w => (w.categoryIds || []).includes("meme")).length} / 插画 ${works.filter(w => (w.categoryIds || []).includes("illustration")).length} / 设定 ${works.filter(w => (w.categoryIds || []).includes("setting")).length} / 漫画 ${works.filter(w => (w.categoryIds || []).includes("comic")).length}</span><span class="p">p.06</span></li>
        </ul>
      </div>
    </div>
    <figure class="cover-hero" style="margin:0">
      <span class="seal cover-seal">国庆<br>特集</span>
      <img src="${esc(hero.large || hero.thumb)}" data-alt="${esc(hero.thumb)}" alt="${esc(hero.name)}">
      <figcaption class="plate-cap"><span>COVER — ${esc(hero.name)}</span><span>${esc(whoOf(hero))} · ${new Date(hero.createdAt).toLocaleDateString("zh-CN")}</span></figcaption>
    </figure>
  </section>` + footer();
  app.querySelectorAll("[data-go]").forEach(li => li.addEventListener("click", () => {
    if (li.dataset.char) state.char = li.dataset.char; else state.char = "";
    state.q = ""; state.cats.clear(); state.sort = "new";
    location.hash = li.dataset.go;
  }));
}

/* ================= 特集索引 ================= */
function renderWorks() {
  const list = filtered();
  const chars = [{ id: "", name: "全部", n: works.length }].concat(activeChars.map(c => ({ ...c, n: worksByChar.get(c.id).length })));
  const sorts = [["new", "新着順"], ["old", "初出順"], ["rnd", "随机翻开"]];
  app.innerHTML = masthead("works") + `
  <div class="sec-head"><span class="no">01 — 04</span><h2>特集索引</h2><span class="en">FULL INDEX</span>
    <span class="cnt">収録 <b>${list.length}</b> / ${works.length} 件</span></div>
  <p class="sec-lead">点击任意图版进入作品页。索引支持检索与按角色、分类 narrowing；「色调」可在墨版印刷感与原色之间切换。</p>
  <div class="toolbar">
    <span class="lbl">検索</span><input id="q" type="search" placeholder="作品名 / 描述 / 标签 / 角色…" value="${esc(state.q)}">
    <span class="lbl">分類</span>
    <div class="tabs" id="catTabs">${D.categories.map(c =>
      `<button data-cat="${esc(c.id)}" class="${state.cats.has(c.id) ? "on" : ""}">${esc(c.name)}<span class="n">${works.filter(w => (w.categoryIds || []).includes(c.id)).length}</span></button>`).join("")}</div>
  </div>
  <div class="toolbar">
    <span class="lbl">角色</span>
    <div class="tabs" id="charTabs">${chars.map(c =>
      `<button data-char="${esc(c.id)}" class="${state.char === c.id ? "on" : ""}">${esc(c.name)}<span class="n">×${c.n}</span></button>`).join("")}</div>
    <span class="lbl">排序</span>
    <div class="tabs" id="sortTabs">${sorts.map(([k, t]) =>
      `<button data-sort="${k}" class="${state.sort === k ? "on" : ""}">${t}</button>`).join("")}</div>
    <span class="lbl">色调</span>
    <div class="tabs" id="toneTabs">
      <button data-tone="mono" class="${state.tone === "mono" ? "on" : ""}">墨版 MONO</button>
      <button data-tone="color" class="${state.tone === "color" ? "on" : ""}">原色 COLOR</button>
    </div>
  </div>
  <div class="hitline" id="hitline">HIT <b>${list.length}</b> 件 — ${esc(ISSUE)} · ${esc(ISSUE_DATE)}</div>
  ${list.length ? `<div class="mosaic${state.tone === "mono" ? " mono" : ""}" id="mosaic">${list.map((w, i) => mcardHTML(w, i === 0)).join("")}</div>`
    : `<div class="empty-note">── 没有匹配的稿件，换个条件试试 ──</div>`}` + footer();

  $("#q").addEventListener("input", e => { state.q = e.target.value; refreshWorks(); });
  $("#charTabs").addEventListener("click", e => { const b = e.target.closest("[data-char]"); if (b) { state.char = b.dataset.char; refreshWorks(); } });
  $("#catTabs").addEventListener("click", e => { const b = e.target.closest("[data-cat]"); if (b) { const c = b.dataset.cat; state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c); refreshWorks(); } });
  $("#sortTabs").addEventListener("click", e => { const b = e.target.closest("[data-sort]"); if (b) { state.sort = b.dataset.sort; refreshWorks(); } });
  $("#toneTabs").addEventListener("click", e => {
    const b = e.target.closest("[data-tone]"); if (!b) return;
    state.tone = b.dataset.tone;
    try { localStorage.setItem("magazine-tone", state.tone); } catch {}
    refreshWorks();
  });
}
function mcardHTML(w, lead) {
  return `<a class="mcard${lead ? " lead" : ""}" href="#/w/${esc(w.slug)}">
    <img class="ph" loading="lazy" decoding="async" src="${esc(w.thumb)}" alt="${esc(w.name)}">
    <span class="cap"><span class="l1"><span class="no">図版 No.${pad(thumbNo.get(w.slug), 3)}</span>${isNew(w) ? '<span class="newmark">新</span>' : ""}</span>
    <span class="nm">${esc(w.name)}</span><span class="who">${esc(whoOf(w))} ─ ${esc(catsOf(w))}</span></span></a>`;
}
function refreshWorks() {
  const list = filtered();
  const mosaic = $("#mosaic");
  if (mosaic) { mosaic.classList.toggle("mono", state.tone === "mono"); mosaic.innerHTML = list.map((w, i) => mcardHTML(w, i === 0)).join(""); }
  else if (list.length) location.reload();
  const empty = $(".empty-note");
  if (!list.length && !empty) $(".hitline").insertAdjacentHTML("afterend", `<div class="empty-note">── 没有匹配的稿件，换个条件试试 ──</div>`);
  if (list.length && empty) empty.remove();
  const hit = $("#hitline"); if (hit) hit.innerHTML = `HIT <b>${list.length}</b> 件 — ${esc(ISSUE)} · ${esc(ISSUE_DATE)}`;
  document.querySelectorAll("#charTabs button").forEach(b => b.classList.toggle("on", b.dataset.char === state.char));
  document.querySelectorAll("#catTabs button").forEach(b => b.classList.toggle("on", state.cats.has(b.dataset.cat)));
  document.querySelectorAll("#sortTabs button").forEach(b => b.classList.toggle("on", b.dataset.sort === state.sort));
  document.querySelectorAll("#toneTabs button").forEach(b => b.classList.toggle("on", b.dataset.tone === state.tone));
}

/* ================= 图版页 ================= */
function renderDetail(slug) {
  const w = works.find(x => x.slug === slug);
  if (!w) { location.hash = "#/works"; return; }
  const list = filtered();
  let idx = list.findIndex(x => x.slug === slug);
  if (idx < 0) { list.length = 0; list.push(...works); idx = works.findIndex(x => x.slug === slug); }
  const prev = idx > 0 ? list[idx - 1] : null;
  const next = idx >= 0 && idx < list.length - 1 ? list[idx + 1] : null;
  const c = charById.get(w.characterId);
  document.title = `${w.name} · 蓝色大肥鱼月刊 ${ISSUE}`;
  app.innerHTML = masthead("") + `
  <article class="plate">
    <div class="imgbox">
      <img src="${esc(w.large || w.thumb)}" data-alt="${esc(w.thumb)}" alt="${esc(w.name)}">
      <div class="cap"><span>PLATE No.${pad(thumbNo.get(w.slug), 3)} / ${works.length}</span><span>${w.width}×${w.height}px</span></div>
    </div>
    <div class="article">
      <p class="kicker">${esc(whoOf(w))}<span class="sep"> ── </span>${esc(catsOf(w) || "未分類")}<span class="sep"> ── </span>${new Date(w.createdAt).toLocaleDateString("zh-CN")}</p>
      <h1>${esc(w.name)}</h1>
      <div class="byline">収録於 ${esc(ISSUE)} · ${esc(ISSUE_DATE)} · 投稿整理：藍色大肥魚編輯部</div>
      <p class="body-lead">${esc(w.description || "（本件暂无描述。）")}</p>
      ${w.commentary ? `<div class="editor-note"><span class="tag">編者按 · 鱼说</span><p>${esc(w.commentary)}</p></div>` : ""}
      <p class="kw"><b>關鍵詞</b>${(w.tags || []).map(t => `<span>${esc(t)}</span>`).join("") || "無"}</p>
      <div class="actions">
        <a class="btn solid" href="${esc(w.original || w.large)}" download target="_blank" rel="noopener">下载原图 ↓</a>
        <a class="btn" href="${esc(w.page)}" target="_blank" rel="noopener">正式站页面 ↗</a>
      </div>
      <div class="pager">
        ${prev ? `<a href="#/w/${esc(prev.slug)}">← 前図版 ${esc(prev.name)}</a><span></span>` : "<span></span>"}
        ${next ? `<a href="#/w/${esc(next.slug)}">次図版 ${esc(next.name)} →</a>` : "<span></span>"}
      </div>
      <p class="backline"><a href="#/works">← 返回特集索引</a></p>
    </div>
  </article>` + footer();
}

/* ================= 角色名录 ================= */
function renderChars() {
  app.innerHTML = masthead("chars") + `
  <div class="sec-head"><span class="no">03</span><h2>角色名录</h2><span class="en">CHARACTER FILES</span>
    <span class="cnt">本刊常驻 <b>${activeChars.length}</b> 位</span></div>
  <p class="sec-lead">按收录量排序。点击任意角色，跳转至 TA 的作品特集页。</p>
  <div id="charList">${[...activeChars].sort((a, b) => worksByChar.get(b.id).length - worksByChar.get(a.id).length).map((c, i) => charRow(c, i)).join("")}</div>` + footer();
  $("#charList").addEventListener("click", e => {
    const b = e.target.closest("[data-char]"); if (!b) return;
    state.char = b.dataset.char; state.q = ""; state.cats.clear(); state.sort = "new";
    location.hash = "#/works";
  });
}
function charRow(c, i) {
  const ws = worksByChar.get(c.id);
  const tc = new Map();
  ws.forEach(w => (w.tags || []).forEach(t => tc.set(t, (tc.get(t) || 0) + 1)));
  const tags = [...tc.entries()].sort((a, b) => b[1] - a[1]).slice(0, 4).map(e => e[0]);
  return `<button class="charrow" data-char="${esc(c.id)}">
    <span class="idx">${pad(i + 1, 2)}</span>
    <span class="nm"><span class="swatch" style="background:linear-gradient(90deg, ${esc(c.colorSoft)}, ${esc(c.colorDeep)})"></span>${esc(c.name)}${c.id === "deepseek" ? '<span class="feat">特集</span>' : ""}<small>${esc((c.aliases || []).join(" / ") || c.id)}</small></span>
    <span class="cnt">${ws.length}<small>件</small></span>
    <span></span>
    <span class="kwline">${tags.map(t => `<i>#${esc(t)}</i>`).join("")}最近更新 ${ws.length ? new Date(Math.max(...ws.map(w => +new Date(w.createdAt)))).toLocaleDateString("zh-CN") : "—"}</span>
  </button>`;
}

/* ================= 路由 ================= */
function route() {
  const h = location.hash;
  if (h.startsWith("#/w/")) { renderDetail(h.slice(4)); return; }
  document.title = `蓝色大肥鱼 月刊 · ${ISSUE_DATE} 国庆特集`;
  if (h === "#/works") { renderWorks(); return; }
  if (h === "#/chars") { renderChars(); return; }
  renderCover();
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
