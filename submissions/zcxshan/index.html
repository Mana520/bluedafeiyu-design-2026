<title>蓝色大肥鱼 · AI娘二创画廊</title>
<style>
  :root {
    --bg1: #f2f8ff; --bg2: #ffffff;
    --surface: #fff; --border: #e6eef9;
    --text: #0f172a; --text-dim: #5b7292;
    --accent: #3b82f6; --accent-deep: #1d4ed8; --accent-soft: #93c5fd;
    --violet: #8b5cf6; --cyan: #38bdf8;
    --grad-main: linear-gradient(120deg, #2563eb 0%, #3b82f6 40%, #8b5cf6 80%, #38bdf8 100%);
    --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", -apple-system, sans-serif;
    color: var(--text); line-height: 1.6;
    min-height: 100vh; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(1200px 800px at 82% -12%, rgba(147,197,253,0.38) 0%, transparent 60%),
      radial-gradient(1000px 700px at -8% 28%, rgba(191,219,254,0.42) 0%, transparent 55%),
      radial-gradient(900px 600px at 60% 110%, rgba(224,231,255,0.5) 0%, transparent 60%),
      linear-gradient(180deg, #f2f8ff 0%, #ffffff 100%);
    background-attachment: fixed;
  }

  /* ===== 背景装饰层 ===== */
  .bg-decor { position: fixed; inset: 0; z-index: -1; overflow: hidden; }

  /* 流动极光光斑 */
  .aurora { position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.5; animation: drift 22s ease-in-out infinite alternate; }
  .aurora-1 { width: 540px; height: 540px; background: linear-gradient(135deg, #93c5fd, #a5b4fc); top: -140px; right: -100px; }
  .aurora-2 { width: 480px; height: 480px; background: linear-gradient(135deg, #bfdbfe, #e0e7ff); bottom: -120px; left: -140px; animation-delay: -7s; }
  .aurora-3 { width: 400px; height: 400px; background: linear-gradient(135deg, #c7d2fe, #bae6fd); top: 32%; left: 58%; animation-delay: -13s; opacity: 0.35; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(70px, -50px) scale(1.15); }
  }

  /* 点阵花纹 */
  .bg-dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(59,130,246,0.16) 1px, transparent 1.5px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 78%);
    mask-image: radial-gradient(ellipse at center, black 25%, transparent 78%);
  }

  /* 顶部弧线花纹 */
  .bg-curve {
    position: absolute; top: 0; left: 0; width: 100%; height: 220px;
    opacity: 0.55; pointer-events: none;
  }

  /* 闪烁微星 */
  .spark {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #93c5fd; opacity: 0.4;
    animation: twinkle 3.2s ease-in-out infinite;
  }
  .spark-1 { top: 24%; left: 8%; animation-delay: 0s; }
  .spark-2 { top: 15%; left: 38%; width: 3px; height: 3px; animation-delay: 0.8s; }
  .spark-3 { top: 48%; left: 92%; animation-delay: 1.4s; }
  .spark-4 { top: 70%; left: 5%; width: 3px; height: 3px; animation-delay: 2s; }
  .spark-5 { top: 85%; left: 60%; animation-delay: 0.4s; }
  .spark-6 { top: 38%; left: 75%; width: 3px; height: 3px; animation-delay: 1.1s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.7); }
    50% { opacity: 0.6; transform: scale(1.25); }
  }

  /* 线条花纹带 */
  .bg-pattern { position: absolute; inset: 0; pointer-events: none; }
  .pat-row { position: absolute; display: flex; align-items: center; gap: 54px; }
  .pat {
    width: 68px; height: 68px;
    fill: none; stroke: #8ab8f5;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
    opacity: 0.72;
  }
  .pat-row-1 { top: 10%; left: -34px; transform: rotate(-8deg); }
  .pat-row-2 { top: 28%; right: -36px; transform: rotate(12deg); }
  .pat-row-3 { top: 46%; left: -46px; transform: rotate(-10deg); }
  .pat-row-4 { top: 64%; right: -34px; transform: rotate(8deg); }
  .pat-row-5 { bottom: 16%; left: -2%; transform: rotate(-6deg); }
  .pat-row-6 { bottom: -4%; right: -2%; transform: rotate(10deg); }

  #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }

  /* ===== 导航栏 ===== */
  .nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(244,250,255,0.72); backdrop-filter: blur(22px) saturate(1.4);
    border-bottom: 1px solid rgba(147,197,253,0.25);
    padding: 0 24px;
  }
  .nav-inner { max-width: 1280px; margin: 0 auto; height: 58px; display: flex; align-items: center; justify-content: space-between; }
  .logo {
    font-size: 18px; font-weight: 800; text-decoration: none;
    letter-spacing: 0.06em;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    background: linear-gradient(120deg, #1d4ed8 10%, #3b82f6 50%, #8b5cf6 90%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .nav-links { display: flex; gap: 30px; }
  .nav-links a {
    font-size: 13px; font-weight: 500; color: var(--text-dim);
    text-decoration: none; transition: color 0.2s; position: relative;
    letter-spacing: 0.04em;
  }
  .nav-links a::after {
    content: ''; position: absolute; left: 0; bottom: -4px;
    width: 0; height: 2px; border-radius: 2px;
    background: var(--grad-main); transition: width 0.25s;
  }
  .nav-links a:hover { color: var(--accent); }
  .nav-links a:hover::after { width: 100%; }

  /* ===== Hero ===== */
  .hero { max-width: 1280px; margin: 0 auto; padding: 34px 24px 18px; text-align: center; position: relative; }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
    color: var(--accent-deep);
    background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(239,246,255,0.9));
    border: 1px solid rgba(147,197,253,0.5);
    padding: 5px 16px; border-radius: 999px; margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(59,130,246,0.12);
  }
  .hero-badge .pulse { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; box-shadow: 0 0 8px rgba(34,197,94,0.6); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .hero h1 {
    font-size: clamp(30px, 4.6vw, 46px);
    font-weight: 900; line-height: 1.12;
    letter-spacing: 0.04em; margin-bottom: 10px;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
  }
  .hero h1 .gradient {
    background: linear-gradient(120deg, #2563eb 0%, #3b82f6 35%, #8b5cf6 65%, #38bdf8 100%);
    background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    animation: shimmer 5s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  .hero .subline {
    display: inline-block; position: relative;
    font-size: 14px; color: var(--text-dim); letter-spacing: 0.12em;
    padding: 0 22px;
  }
  .hero .subline::before, .hero .subline::after {
    content: ''; position: absolute; top: 50%; width: 34px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent-soft));
  }
  .hero .subline::before { left: -6px; }
  .hero .subline::after { right: -6px; transform: scaleX(-1); }
  .hero-stats {
    display: inline-flex; gap: 40px; margin-top: 20px;
    padding: 12px 32px;
    background: linear-gradient(135deg, rgba(255,255,255,0.92), rgba(239,246,255,0.75));
    border: 1px solid rgba(147,197,253,0.4);
    border-radius: 18px;
    box-shadow: 0 6px 24px rgba(59,130,246,0.1);
    backdrop-filter: blur(10px);
  }
  .stat { text-align: center; }
  .stat b {
    font-size: 22px; font-weight: 900; display: block;
    background: var(--grad-main);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .stat span { font-size: 11px; color: var(--text-dim); letter-spacing: 0.1em; }

  /* ===== 筛选区 ===== */
  .controls { max-width: 1280px; margin: 0 auto; padding: 0 24px 22px; }
  .search-row { margin-bottom: 14px; }
  .search-box { position: relative; max-width: 480px; margin: 0 auto; }
  .search-box input {
    width: 100%; padding: 11px 16px 11px 44px;
    background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(240,247,255,0.85));
    border: 1px solid rgba(147,197,253,0.4);
    border-radius: 14px; color: var(--text); font-size: 14px;
    outline: none; transition: all 0.25s;
    box-shadow: 0 2px 10px rgba(59,130,246,0.06);
  }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(59,130,246,0.12), 0 4px 16px rgba(59,130,246,0.12); }
  .search-box input::placeholder { color: #94a3b8; }
  .search-box svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: #94a3b8; }
  .filter-group { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .filter-label { font-size: 11px; font-weight: 600; color: var(--text-dim); letter-spacing: 0.12em; margin-bottom: 2px; }
  .chip {
    padding: 5px 13px; font-size: 12px; font-weight: 500;
    background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(240,247,255,0.8));
    border: 1px solid rgba(147,197,253,0.35);
    border-radius: 999px; color: var(--text-dim);
    cursor: pointer; transition: all 0.22s;
    letter-spacing: 0.04em;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 2px 10px rgba(59,130,246,0.15); transform: translateY(-1px); }
  .chip.active {
    background: var(--grad-main); border-color: transparent; color: white;
    box-shadow: 0 4px 14px rgba(59,130,246,0.35);
  }

  /* ===== 画廊 ===== */
  .gallery { max-width: 1280px; margin: 0 auto; padding: 0 24px 80px; }
  .gallery-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
  .gallery-header h2 {
    font-size: 18px; font-weight: 800; letter-spacing: 0.06em;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    display: flex; align-items: center; gap: 10px;
  }
  .gallery-header h2::before {
    content: ''; width: 4px; height: 18px; border-radius: 3px;
    background: var(--grad-main);
  }
  .gallery-header .count { font-size: 13px; color: var(--text-dim); letter-spacing: 0.06em; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 26px;
  }

  /* ===== 卡片：粉蓝渐变明信片 ===== */
  .card-wrap {
    perspective: 1000px;
    opacity: 0; transform: translateY(20px);
    animation: fadeUp 0.5s forwards;
  }
  .card {
    background: linear-gradient(160deg, #ffd6e8 0%, #f9c5f1 30%, #d4b5fc 55%, #a8d8ff 85%, #9ec5ff 100%);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none; color: inherit;
    position: relative;
    transition: all 0.5s ease-in-out;
    transform-style: preserve-3d;
    box-shadow:
      0 6px 24px rgba(255,107,167,0.12),
      0 8px 30px rgba(108,175,255,0.1),
      inset 0 0 0 6px rgba(255,255,255,0.55),
      inset 0 0 0 7px rgba(255,182,215,0.3);
    display: flex; flex-direction: column;
  }
  .card:hover {
    transform: rotate3d(1, 1, 0, 25deg);
    box-shadow:
      0 12px 40px rgba(255,107,167,0.2),
      0 15px 45px rgba(108,175,255,0.16),
      inset 0 0 0 6px rgba(255,255,255,0.65),
      inset 0 0 0 7px rgba(255,182,215,0.4);
  }

  /* 明信片顶部邮戳风印章装饰 */
  .card::before {
    content: '✉';
    position: absolute; top: 10px; right: 12px;
    width: 28px; height: 28px;
    z-index: 3;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: rgba(255,107,167,0.45);
    border: 2px dashed rgba(255,107,167,0.3);
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    transform: rotate(-12deg);
    pointer-events: none;
  }
  /* 右下角粉蓝光晕装饰 */
  .card::after {
    content: '';
    position: absolute; right: -20px; bottom: -20px;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, rgba(168,216,255,0.35), transparent 70%);
    pointer-events: none;
  }

  .card-img-wrap {
    padding: 28px 28px 0;
    display: flex; justify-content: center;
    transform: translate3d(0, 0, 20px);
    transition: transform 0.5s ease-in-out;
  }
  .card:hover .card-img-wrap { transform: translate3d(0, 0, 40px); }
  .card-img {
    width: 100%; max-height: 200px; object-fit: cover;
    border-radius: 4px; display: block;
    box-shadow: 0 3px 12px rgba(255,107,167,0.12), 0 2px 8px rgba(108,175,255,0.1);
    border: 3px solid rgba(255,255,255,0.7);
  }

  .card-body {
    padding: 14px 28px 20px; flex: 1;
    display: flex; flex-direction: column;
    transform: translate3d(0, 0, 25px);
    transition: transform 0.5s ease-in-out;
    position: relative;
  }
  .card:hover .card-body { transform: translate3d(0, 0, 45px); }
  /* 明信片分割线 */
  .card-body::before {
    content: '';
    position: absolute; top: 0; left: 28px; right: 28px;
    height: 0;
    border-top: 1.5px dashed rgba(255,107,167,0.25);
  }
  .card-title {
    font-size: 15px; font-weight: 700; margin-bottom: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: 0.02em;
    position: relative; padding-left: 11px;
  }
  .card-title::before {
    content: ''; position: absolute; left: 0; top: 50%;
    transform: translateY(-50%);
    width: 3px; height: 14px; border-radius: 3px;
    background: linear-gradient(135deg, #ff6ba7, #a8d8ff);
  }
  .card-desc {
    font-size: 13px; color: var(--text-dim); margin-bottom: 12px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    margin-top: auto;
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 10px;
    position: relative;
  }
  .card-meta::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, rgba(255,107,167,0.25), rgba(168,216,255,0.08));
  }
  .card-char {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: var(--text);
  }
  .card-char::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, #ff6ba7, #a8d8ff);
    box-shadow: 0 0 6px rgba(255,107,167,0.4);
  }
  .card-date { font-size: 12px; color: #8aa3c4; letter-spacing: 0.04em; }

  .card-tag {
    position: absolute; top: 14px; left: 14px;
    font-size: 11px; font-weight: 700;
    padding: 4px 12px; border-radius: 2px;
    background: linear-gradient(135deg, #ff9ec7, #a8d8ff);
    color: white;
    box-shadow: 0 2px 8px rgba(255,107,167,0.25);
    z-index: 2;
    transform: translate3d(0, 0, 30px) rotate(-3deg);
    letter-spacing: 0.06em;
    border: 1px dashed rgba(255,255,255,0.5);
  }

  .empty { text-align: center; padding: 80px 20px; color: var(--text-dim); }
  .empty h3 { font-size: 18px; margin-bottom: 8px; }

  footer {
    text-align: center; padding: 30px 24px;
    font-size: 12px; color: var(--text-dim); letter-spacing: 0.1em;
    border-top: 1px solid rgba(147,197,253,0.25);
    background: linear-gradient(180deg, transparent, rgba(239,246,255,0.5));
  }

  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

  @media (hover: none) { .card:hover { transform: none; } }
  @media (max-width: 640px) {
    .hero { padding: 24px 16px 16px; }
    .controls { padding: 0 16px 20px; }
    .gallery { padding: 0 16px 60px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .nav-links { display: none; }
    .hero-stats { gap: 22px; padding: 10px 22px; }
    .card-img { max-height: 160px; }
    .card-body { padding: 12px 18px 16px; }
    .card-img-wrap { padding: 18px 18px 0; }
    .card-desc { display: none; }
    .hero .subline::before, .hero .subline::after { display: none; }
  }
</style>
</head>

<script>
// ===== 蓝白粒子拖尾 =====
  var canvas = document.getElementById('particles');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var lastX = 0, lastY = 0;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function spawn(x, y) {
    for (var i = 0; i < 3; i++) {
      particles.push({
        x: x + (Math.random() - 0.5) * 8,
        y: y + (Math.random() - 0.5) * 8,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2 - 0.5,
        r: Math.random() * 3 + 1.5,
        life: 1,
        decay: Math.random() * 0.02 + 0.015,
        blue: Math.random() > 0.5
      });
    }
  }

  document.addEventListener('mousemove', function(e) {
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.sqrt(dx*dx + dy*dy) > 3) {
      spawn(e.clientX, e.clientY);
      lastX = e.clientX; lastY = e.clientY;
    }
  });

  (function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = particles.filter(function(p) { return p.life > 0; });
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.02; p.life -= p.decay;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fillStyle = p.blue
        ? 'rgba(59,130,246,' + (p.life * 0.7) + ')'
        : 'rgba(255,255,255,' + (p.life * 0.8) + ')';
      ctx.fill();
    }
    requestAnimationFrame(animate);
  })();
</script>

<script>
(function() {
  function loadScript(src, onDone) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = function() { onDone(true); };
    s.onerror = function() { if (s.parentNode) s.parentNode.removeChild(s); onDone(false); };
    document.head.appendChild(s);
  }
  loadScript('../../starter/data.js', function(ok) {
    if (ok && window.SITE_DATA) { window.__initGallery(); return; }
    loadScript('./data.js', function() { if (window.SITE_DATA) window.__initGallery(); });
  });
})();
</script>

<script>
window.__initGallery = function() {
  var works = window.SITE_DATA.works;
  var characters = window.SITE_DATA.characters;
  var categories = window.SITE_DATA.categories;
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  var charMap = {}; characters.forEach(function(c){charMap[c.id]=c});
  var catMap = {}; categories.forEach(function(c){catMap[c.id]=c});
  var activeChar = '', activeCat = '', query = '';
  var usedChars = {};
  works.forEach(function(w){usedChars[w.characterId]=true});
  document.getElementById('statWorks').textContent = works.length;
  document.getElementById('statChars').textContent = Object.keys(usedChars).length;
  document.getElementById('statCats').textContent = categories.length;
  var charFilters = document.getElementById('charFilters');
  var charList = characters.filter(function(c){return usedChars[c.id]});
  charFilters.innerHTML = '<button class="chip active" data-char="">全部</button>' +
    charList.map(function(c){return '<button class="chip" data-char="'+esc(c.id)+'">'+esc(c.name)+'</button>'}).join('');
  var catFilters = document.getElementById('catFilters');
  catFilters.innerHTML = '<button class="chip active" data-cat="">全部</button>' +
    categories.map(function(c){return '<button class="chip" data-cat="'+esc(c.id)+'">'+esc(c.name)+'</button>'}).join('');
  var grid = document.getElementById('grid');
  var galleryCount = document.getElementById('galleryCount');
  var galleryTitle = document.getElementById('galleryTitle');
  var emptyState = document.getElementById('emptyState');

  function fmtDate(s) { if (!s) return ''; return s.slice(0, 10); }

  var PAGE = 12, rendered = 0, list = [];
  var sentinel = document.createElement('div');
  sentinel.id = 'loadMoreSentinel';
  sentinel.style.cssText = 'height:2px;';
  grid.parentNode.appendChild(sentinel);

  function cardHtml(w, k) {
    var ch = charMap[w.characterId];
    var catName = '';
    var cids = w.categoryIds||[];
    for (var j=0;j<cids.length;j++) if (catMap[cids[j]]) { catName=catMap[cids[j]].name; break; }
    var delay = Math.min(k*20, 160);
    return '<div class="card-wrap" style="animation-delay:'+delay+'ms">' +
      '<a class="card" href="'+esc(w.page)+'" target="_blank" rel="noopener">' +
        (catName ? '<span class="card-tag">'+esc(catName)+'</span>' : '') +
        '<div class="card-img-wrap">' +
          '<img class="card-img" loading="lazy" decoding="async" src="'+esc(w.thumb)+'" alt="'+esc(w.description||w.name)+'">' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="card-title">'+esc(w.name)+'</div>' +
          '<div class="card-desc">'+esc(w.description||'')+'</div>' +
          '<div class="card-meta">' +
            '<span class="card-char">'+esc(ch?ch.name:'')+'</span>' +
            '<span class="card-date">'+esc(fmtDate(w.createdAt))+'</span>' +
          '</div>' +
        '</div>' +
      '</a>' +
    '</div>';
  }

  function loadMore() {
    if (rendered >= list.length) { sentinel.style.display = 'none'; return; }
    var slice = list.slice(rendered, rendered + PAGE);
    rendered += slice.length;
    grid.insertAdjacentHTML('beforeend', slice.map(function(w, k){ return cardHtml(w, k); }).join(''));
    if (rendered >= list.length) sentinel.style.display = 'none';
  }

  var io = new IntersectionObserver(function(entries) {
    if (entries[0].isIntersecting) loadMore();
  }, { rootMargin: '500px' });
  io.observe(sentinel);

  function render() {
    var l = works.slice();
    if (activeChar) l = l.filter(function(w){return w.characterId===activeChar});
    if (activeCat) l = l.filter(function(w){return w.categoryIds.indexOf(activeCat)!==-1});
    if (query) {
      var q = query.toLowerCase();
      l = l.filter(function(w) {
        if (w.name.toLowerCase().indexOf(q)!==-1) return true;
        if ((w.description||'').toLowerCase().indexOf(q)!==-1) return true;
        var tags = w.tags||[];
        for (var i=0;i<tags.length;i++) if (tags[i].toLowerCase().indexOf(q)!==-1) return true;
        return false;
      });
    }
    l.sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt)});
    list = l;
    galleryCount.textContent = list.length + ' 件';
    galleryTitle.textContent = (activeChar && charMap[activeChar]) ? charMap[activeChar].name : '全部作品';
    if (!list.length) { grid.innerHTML=''; emptyState.style.display='block'; sentinel.style.display='none'; return; }
    emptyState.style.display='none';
    grid.innerHTML = '';
    rendered = 0;
    loadMore();
  }
  charFilters.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-char]'); if(!btn) return;
    activeChar = btn.getAttribute('data-char');
    charFilters.querySelectorAll('.chip').forEach(function(b){b.classList.toggle('active', b===btn)});
    render();
  });
  catFilters.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-cat]'); if(!btn) return;
    activeCat = btn.getAttribute('data-cat');
    catFilters.querySelectorAll('.chip').forEach(function(b){b.classList.toggle('active', b===btn)});
    render();
  });
  document.getElementById('searchInput').addEventListener('input', function(e){query=e.target.value.trim(); render()});
  render();
};
</script>
